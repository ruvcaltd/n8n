name: Deploy n8n to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Validate VPS secrets
        run: |
          if [ -z "${{ secrets.VPS_USER }}" ] || [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "ERROR: VPS_USER and VPS_HOST must be set as repository secrets."
            exit 1
          fi

      - name: Test SSH connection
        run: |
          echo "Checking loaded SSH keys:"
          ssh-add -l
          echo "Testing SSH connection:"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH connection successful'"

      - name: Copy repo to remote server
        run: |
          rsync -avz --delete --exclude '.git' --exclude '.github' --exclude '.env' -e "ssh -o StrictHostKeyChecking=no" . ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/n8n-deploy

      - name: Deploy on remote server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
            set -e
            mkdir -p /opt/n8n
            rsync -avz --delete --exclude '.env' /tmp/n8n-deploy/ /opt/n8n/
            cd /opt/n8n
            if [ ! -f .env ]; then
              echo 'ERROR: .env missing on VPS. Copy your env file or configure secrets.'
              exit 1
            fi
            docker compose pull
            docker compose up -d --force-recreate

            echo 'Waiting for workflow import log entry...'
            import_attempts=0
            until docker compose logs --no-color n8n 2>&1 | grep -q 'Importing workflows from'; do
              import_attempts=$((import_attempts + 1))
              if [ ${import_attempts} -ge 24 ]; then
                echo 'ERROR: Timed out waiting for n8n workflow import to start.'
                docker compose logs --no-color n8n | tail -n 100
                exit 1
              fi
              sleep 5
            done

            echo 'Workflow import detected in n8n startup logs.'
            docker compose ps
          EOF

      - name: Clean remote temp folder
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'rm -rf /tmp/n8n-deploy'
